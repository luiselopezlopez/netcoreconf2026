# yaml-language-server: $schema=https://aka.ms/azure-dev/v1.0/azure.yaml.json
name: poliamor-netcoreconf

infra:
  provider: bicep
  path: infra

hooks:
  prepackage:
    shell: pwsh
    run: ./scripts/package-demo-web.ps1
    interactive: false
  preprovision:
    shell: pwsh
    run: ./scripts/check-context.ps1
    interactive: false
  postdeploy:
    shell: pwsh
    run: ./scripts/configure-mcp.ps1
    interactive: false

services:
  web:
    project: ./.azure/web-package
    language: python
    host: appservice
  restaurantes:
    project: ./src/restaurantes
    language: python
    host: function
  orquestador:
    project: ./src/orquestador
    language: python
    host: function
  presupuesto:
    project: ./src/presupuesto
    language: python
    host: function
